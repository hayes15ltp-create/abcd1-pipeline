name: Autoupdate verification database

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/verify.sqlite3"
      - "data/verify.sqlite3-shm"
      - "data/verify.sqlite3-wal"
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write

concurrency:
  group: verification-database-update
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline tests
        run: python -m pip install pytest && python -m pytest -q

      - name: Add 10 synthetic AAV verification runs
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/update_verify_aav.py --db data/verify.sqlite3 --count 10 --batch-id "${GITHUB_RUN_ID}"

      - name: Commit and push database update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verify.sqlite3
          if git diff --cached --quiet -- data/verify.sqlite3; then
            echo "No database change to commit."
            exit 0
          fi
          git diff --cached --stat -- data/verify.sqlite3
          git commit -m "Update verification database with AAV runs [skip ci]"
          git push origin HEAD:main
